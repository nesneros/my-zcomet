[env]
PROFILING = "0" # Set to "1" to enable profiling

[tools]
go-jsonnet = "latest"
# usage = "latest"

[tasks.generate]
alias = "githook-post-merge"
description = "Generate completions and init scripts"
run = "./setup/generate-source-cache.sh && ./setup/generate-completions.sh"

[tasks.sys-init]
description = "Initialize system. This is idempotent"
run = "cd $MISE_PROJECT_ROOT && ./setup/sys-init.sh"
